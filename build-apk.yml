# .github/workflows/build-apk.yml
# WebView (Capacitor) APK — ડેટા APK ની અંદર રહે છે, Chrome clear કરવાથી જાય નહીં.
# ફક્ત PRIVATE રિપોમાં વાપરો (સાઇનિંગ key રિપોમાં સેવ થાય છે).
name: Build APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_ID: com.bhavik.markethub
  APP_NAME: Market Hub
  KS_PASS: markethub-change-me-123

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # પહેલી વાર જ key બને અને રિપોમાં સેવ થાય. પછી દર વખતે એ જ key વપરાય,
      # એટલે નવી APK જૂના પર અપડેટ થાય અને ડેટા જળવાઈ રહે.
      - name: Signing key (એક જ વાર બને)
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -v -keystore release.jks -alias markethub \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Market Hub, O=Personal, C=IN"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add release.jks
            git commit -m "Add signing key"
            git push
          fi

      - name: વેબ ફાઇલો www માં
        run: |
          mkdir -p www
          cp *.html *.js www/
          [ -f manifest.json ] && cp manifest.json www/ || true
          cp *.png www/ 2>/dev/null || true

      - name: Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share jszip@3.10.1
          cp node_modules/jszip/dist/jszip.min.js www/jszip.min.js
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build
        run: cd android && ./gradlew assembleRelease

      - name: Sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias markethub \
            --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" \
            --out MarketHub.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MarketHub-apk
          path: MarketHub.apk
